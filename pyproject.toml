[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telecodex"
version = "0.1.0"
description = "A self-hosted Telegram interface for Codex"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "av>=11,<19",
    "httpx[socks]>=0.27,<1",
    "faster-whisper>=1.2,<2",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1,<1",
    "python-dotenv>=1,<2",
]

[project.scripts]
telecodex = "telecodex.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telecodex = ["texts/*.json"]
